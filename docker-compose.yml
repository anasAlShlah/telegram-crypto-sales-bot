services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-crypto-sales-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_MODE=${BOT_MODE:-polling}
      - WEBHOOK_DOMAIN=${WEBHOOK_DOMAIN:-http://localhost:3000}
      - WEBHOOK_PATH=${WEBHOOK_PATH:-/bot/webhook}
      - USDT_BEP20_WALLET=${USDT_BEP20_WALLET:-0x0730236b443035c3434de32263594e6bd9ce3d94}
      - USDT_TRC20_WALLET=${USDT_TRC20_WALLET:-TPPdHJZRFsdsu4YiqQfPkGH1L3UzwNx74N}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - TAX_RATE=${TAX_RATE:-0.05}
      - CRYPTO_PAYMENT_TIMEOUT_MINUTES=${CRYPTO_PAYMENT_TIMEOUT_MINUTES:-60}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
